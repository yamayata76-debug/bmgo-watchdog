name: watchdog
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: state.txt
          key: watchdog-state
          restore-keys: watchdog-state

      - name: Check site, origins, front door and DNS
        id: checks
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ORIGIN_A_URL: ${{ secrets.ORIGIN_A_URL }}
          ORIGIN_B_URL: ${{ secrets.ORIGIN_B_URL }}
          EXPECTED_TARGET: ${{ secrets.EXPECTED_TARGET }}
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          prev_failures=$(sed -n '1p' state.txt 2>/dev/null || true)
          prev_sig=$(sed -n '2p' state.txt 2>/dev/null || true)
          failures=""
          probe() { curl -sf --max-time 20 -H 'X-BG-Client: webapp' "$1/api/health" | grep -q '"status":"ok"'; }
          probe "$SITE_URL"       || failures="$failures site-down"
          probe "$ORIGIN_A_URL"   || failures="$failures originA-down"
          probe "$ORIGIN_B_URL"   || failures="$failures originB-down"
          # Front-door check: record the public Server signature; alert on ANY
          # change (host migration, proxy insert/remove, takeover page).
          sig=$(curl -sI --max-time 20 "$SITE_URL/" | grep -i '^server:' | tr -d '\r' || echo "server: none")
          if [ -n "$prev_sig" ] && [ "$sig" != "$prev_sig" ]; then
            failures="$failures frontdoor-changed($sig)"
          fi
          curl -sI --max-time 20 "$SITE_URL/" | grep -qi '^content-security-policy:' \
            || failures="$failures csp-missing"
          # DNS drift: authoritative www CNAME must equal the expected origin.
          live=$(curl -s --max-time 20 -H "Authorization: Token $DESEC_TOKEN" \
            "https://desec.io/api/v1/dns/$DOMAIN/" \
            | jq -r '.[] | select(.subname=="www" and .type=="CNAME") | .records[0]')
          [ "$live" = "$EXPECTED_TARGET" ] || failures="$failures dns-drift($live)"
          curr=$(echo "$failures" | xargs)
          printf '%s\n%s\n' "$curr" "$sig" > state.txt
          echo "curr=$curr" >> "$GITHUB_OUTPUT"
          if [ "$curr" = "$prev_failures" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram alert on change
        if: steps.checks.outputs.changed == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curr="${{ steps.checks.outputs.curr }}"
          if [ -z "$curr" ]; then msg="BMGO recovered: all checks green"; \
          else msg="BMGO ALERT: $curr"; fi
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=$msg ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
          echo "alerted: $msg"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: watchdog-state-${{ github.run_id }}
